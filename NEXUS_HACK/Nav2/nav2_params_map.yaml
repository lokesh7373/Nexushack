local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.55, 0.25],[0.55, -0.25],[-0.55,-0.25],[-0.55, 0.25]]"
      footprint_padding: 0.2
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.03
      transform_tolerance: 0.5
      plugins: ["voxel_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud
        combination_method: 1
        pointcloud:
          topic: /pointcloud
          max_obstacle_height: 2.5
          min_obstacle_height: -0.1
          clearing: false
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 4.5
          obstacle_max_range: 4.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        origin_z: -0.8
        z_resolution: 0.05
        z_voxels: 40
        combination_method: 1
        publish_voxel_map: true
        publish_voxel_grid: true
        mark_threshold: 1
        unknown_threshold: 15
        observation_sources: pointcloud
        pointcloud:
          topic: /pointcloud
          sensor_frame: sim_lidar
          data_type: "PointCloud2"
          inf_is_valid: true
          marking: true
          clearing: true
          min_obstacle_height: -0.7
          max_obstacle_height: 1.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 50.0
        inflation_radius: 0.52

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.55, 0.25],[0.55, -0.25],[-0.55,-0.25],[-0.55, 0.25]]"
      footprint_padding: 0.1
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: false
      use_sim_time: true
      resolution: 0.07
      origin_z: -2.0
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: false
        map_topic: /map
        subscribe_to_updates: true
        transform_tolerance: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 25.0
        inflation_radius: 0.08
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true


waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: OPEN_LOOP
    max_velocity: [0.9, 0.7, 1.0]
    min_velocity: [-0.5, -0.3, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names:
      - map_server
      - controller_server
      - planner_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
